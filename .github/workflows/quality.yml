name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-key' }}
      E2E_AUTH_STATE_B64: ${{ secrets.E2E_AUTH_STATE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Restore authenticated Google session
        shell: bash
        run: |
          if [ -z "$E2E_AUTH_STATE_B64" ]; then
            echo "::error::Add the E2E_AUTH_STATE_B64 repository secret from a dedicated Google test account."
            exit 1
          fi
          mkdir -p tests/.auth
          printf '%s' "$E2E_AUTH_STATE_B64" | base64 --decode > tests/.auth/google-user.json

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
